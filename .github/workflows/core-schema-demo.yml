name: Core schema and demo regression

on:
  pull_request:
    paths:
      - "schemas/**"
      - "src/**"
      - "demo/**"
      - "tests/**"
      - "schema_tests/**"
      - "requirements-schema-tests.txt"
      - ".github/workflows/core-schema-demo.yml"
  push:
    branches: [main]
    paths:
      - "schemas/**"
      - "src/**"
      - "demo/**"
      - "tests/**"
      - "schema_tests/**"
      - "requirements-schema-tests.txt"
      - ".github/workflows/core-schema-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install development-only schema checks
        run: python -m pip install -r requirements-schema-tests.txt
      - name: Existing human, selection and execution regressions
        run: python -m unittest discover -s tests -v
      - name: Canonical ConfirmedIntent schema admission
        run: python -m unittest discover -s schema_tests -v
      - name: ConfirmedIntent TypeScript admission
        run: npx --yes --package=typescript@5.8.3 tsc --noEmit --strict --target ES2020 schema_tests/confirmed-intent-types.ts
      - name: Browser demo rule matching
        run: node --test tests/test_demo_rule_matching.mjs
